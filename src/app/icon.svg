<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Aomi mark: buku catatan terbuka dengan simbol kode & kilau -->
  <!-- halaman kiri -->
  <path d="M32 15 C26 10.5 17 10 8.5 13.5 L8.5 49.5 C17 46.5 26 47 32 51.5 Z"
        fill="#FFFDF6" stroke="#243247" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- halaman kanan -->
  <path d="M32 15 C38 10.5 47 10 55.5 13.5 L55.5 49.5 C47 46.5 38 47 32 51.5 Z"
        fill="#FFF8E8" stroke="#243247" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- garis tulis halaman kanan -->
  <line x1="38" y1="25" x2="50" y2="23.5" stroke="#277C82" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="38" y1="32" x2="52" y2="30.5" stroke="#C9B98C" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="38" y1="39" x2="48" y2="37.5" stroke="#C9B98C" stroke-width="2.2" stroke-linecap="round"/>
  <!-- simbol </> di halaman kiri -->
  <path d="M20 22 L13.5 28.5 L20 35" stroke="#277C82" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M25.5 22 L28 28.5 L22 38.5" stroke="#243247" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- pita penanda di bawah buku -->
  <path d="M14 49 C19 46.5 26 46 32 50 C38 46 45 45.5 50 48"
        stroke="#243247" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <!-- kilau bintang -->
  <path d="M52.5 4 L54.2 8.8 L59 10.5 L54.2 12.2 L52.5 17 L50.8 12.2 L46 10.5 L50.8 8.8 Z"
        fill="#F6DF83" stroke="#243247" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
